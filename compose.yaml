services:
  postgres:
    image: postgres:16-alpine
    container_name: giromon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-giromon}
      POSTGRES_USER: ${POSTGRES_USER:-giromon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-giromon_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - giromon_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-giromon} -d ${POSTGRES_DB:-giromon}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  giromon_postgres_data:

